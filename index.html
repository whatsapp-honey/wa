  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
    }
    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #667176;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f5ef url("1.jpg") center center / cover no-repeat fixed;
      overscroll-behavior: none;
    }
    .page {
      width: min(100vw, 520px);
      height: 100svh;
      max-height: 100svh;
      padding: clamp(12px, 3vh, 28px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.8vh, 28px);
      text-align: center;
      overflow: hidden;
    }
    .center-art {
      display: block;
      width: min(74vw, 360px);
      max-height: 19svh;
      object-fit: contain;
      border-radius: 4px;
      flex: 0 1 auto;
    }
    .copy {
      width: 100%;
      flex: 0 0 auto;
    }
    .headline {
      margin: 0 0 clamp(10px, 2.2vh, 20px);
      font-size: clamp(19px, 5vw, 27px);
      font-weight: 300;
      letter-spacing: clamp(4px, 1.2vw, 7px);
      white-space: nowrap;
    }
    .features {
      font-size: clamp(12px, 3.3vw, 17px);
      font-weight: 300;
      letter-spacing: clamp(2px, .9vw, 4px);
      line-height: 2.2;
      white-space: nowrap;
    }
    .continue {
      flex: 0 0 auto;
      min-width: 158px;
      padding: 13px 34px;
      border: 1px solid #169c3c;
      border-radius: 7px;
      background: #20b84a;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 5px #00000018;
    }
    .continue:active { background: #159c39; }
    @media (min-width: 700px) {
      .page { width: min(100vw, 560px); }
      .center-art { width: min(42vw, 340px); max-height: 21svh; }
    }
    @media (max-height: 680px) {
      .page { padding-top: 6px; padding-bottom: 6px; gap: 10px; }
      .center-art { max-height: 15svh; }
      .headline { margin-bottom: 8px; }
      .features { line-height: 1.9; }
      .continue { padding: 10px 30px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="center-art" src="2.jpg" alt="WhatsApp">

    <section class="copy" aria-label="Introduction">
      <p class="headline" data-i18n="private">PRIVATE CHATS</p>
      <div class="features">
        <div data-i18n="register">FREE REGISTER</div>
        <div data-i18n="live">LIVE CHAT AND VIDEO CALL</div>
        <div data-i18n="sex">SEX</div>
      </div>
    </section>

    <button class="continue" type="button" data-i18n="continue">CONTINUE</button>
  </main>

  <script>
    const translations = {
      en: { private:"PRIVATE CHATS", register:"FREE REGISTER", live:"LIVE CHAT AND VIDEO CALL", sex:"SEX", continue:"CONTINUE" },
      de: { private:"PRIVATE CHATS", register:"KOSTENLOSE REGISTRIERUNG", live:"LIVE-CHAT UND VIDEOANRUFE", sex:"SEX", continue:"WEITER" },
      es: { private:"CHATS PRIVADOS", register:"REGISTRO GRATIS", live:"CHAT EN VIVO Y VIDEOLLAMADAS", sex:"SEXO", continue:"CONTINUAR" },
      fr: { private:"CHATS PRIVÉS", register:"INSCRIPTION GRATUITE", live:"CHAT EN DIRECT ET APPELS VIDÉO", sex:"SEXE", continue:"CONTINUER" },
      nl: { private:"PRIVÉCHATS", register:"GRATIS REGISTREREN", live:"LIVE CHAT EN VIDEOBELLEN", sex:"SEKS", continue:"DOORGAAN" },
      pt: { private:"CHATS PRIVADOS", register:"CADASTRO GRÁTIS", live:"CHAT AO VIVO E CHAMADAS DE VÍDEO", sex:"SEXO", continue:"CONTINUAR" },
      it: { private:"CHAT PRIVATI", register:"REGISTRAZIONE GRATUITA", live:"CHAT DAL VIVO E VIDEOCHIAMATE", sex:"SESSO", continue:"CONTINUA" }
    };
    const browserLanguage = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    const languageCode = browserLanguage.toLowerCase().split("-")[0];
    const selected = translations[languageCode] || translations.en;
    document.documentElement.lang = translations[languageCode] ? languageCode : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (selected[key]) el.textContent = selected[key];
    });

    document.querySelector(".continue").addEventListener("click", () => {
      window.location.href = "https://byuxyz8.github.io/mypage/Kheh9h7hsRsQ8";
    });

    // Basic deterrents against casual copying (not a security boundary).
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
    document.addEventListener("selectstart", event => event.preventDefault());
    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      const blockedShortcut =
        event.key === "F12" ||
        (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key)) ||
        (event.ctrlKey && ["u", "s"].includes(key));
      if (blockedShortcut) {
        event.preventDefault();
        event.stopPropagation();
      }
    });
  </script>
</body>
